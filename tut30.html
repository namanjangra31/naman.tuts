<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition in Css</title>
</head>
<style>

    body{
        background-color: black;
        color: red;
    }

    #box{
        display: flex;
        justify-content: center;
        align-items: center;
        align-content: center;
        height: 233px;
        width: 233px;
        background-color:white;
        transition-property: background-color;
        /* It helps to transform the property in some time  */
        transition-duration: 1s; 
        /* ease-in - Slow then Fast */
        /* transition-timing-function: ease-in; */
        /* ease-out - Fast then Slow */
        /* same - ease-in-out | slow fast slow  */
        /* transition-timing-function: ease-out ;  */
        /* Transiton starts in 2s  */
        /* transition-delay: 2s;  */

        /* transition:property(name) duration ease-in delay  ;  */
        /* We can add effcts only in property (background_color) by mentioning it in first   */
        /* transition: background-color 1s ease-in 2s; | can represent all property in oneline */

        /* Now this is how we can apply transition in all  */
        transition: all 1s ease-in 1s;
    }


    #box:hover{
        background-color: rgb(0, 189, 0);
        height: 400px;
        width: 400px;
        border-radius: 10px;
    }

</style>
<body>
    <h3>This is CSS Transition Tutorial</h3>
    <div class="container">
        <div id="box">
            This is a box
        </div>
    </div>
</body>
</html>
<!-- For checking the use of transition-timing-function ease-in-out , increase the duration to 4s,5s -->
