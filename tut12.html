<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colours</title>
    <style>
        #firstpara {
            color: rgb(30, 141, 36);
        }
        /* colour by setting rbg value  */ 

        #secondpara {
            color: blue;
        }
        /* colour set by its name  */

        #thirdpara {
            color: #fff;
            background-color: black;
        }
        /* colour set by # hex value */

    </style>
</head>

<body>
    <p id="firstpara"> his is tut for colours</p>
    <p id="secondpara"> his is tut for colours</p>
    <p id="thirdpara"> his is tut for colours</p>
</body>
</html>
