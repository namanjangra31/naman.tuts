<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before and After Pseudo Selector</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: black;
        color: white;
    }

    header::before{
        content: "";
        background: url('https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center/cover;
        position: absolute;
        z-index: -1;
        width: 100%;
        height: 100%;
        top: 0;
        opacity: 0.5;
    }

    section {
        display: flex;
        flex-direction: column;
        margin: 3px 233px;
        height: 290px;
        /* This is for aligning item on the X axis  */
        align-items: center;
        /* This is for aligning item on the Y axis  */
        justify-content: center;
        /* border: 2px solid red; */
    }

    .navigation {
        display: flex;
        font-size: 20px;
    }

    li {
        list-style: none;
        padding: 20px 23px;
    }

    h1 {
        font-size: 3rem;
    }

    p {
        text-align: center;
    }
    /* This property is use for adding content before any elements content , it can also use as "After" */
    /* section::before{
        content: "This is a content";
    } */
</style>

<body>
    <header>
        <nav class="navbar">
            <ul class="navigation">
                <li class="item">Home</li>
                <li class="item">About</li>
                <li class="item">Services</li>
                <li class="item">Contact Us</li>
            </ul>
        </nav>
    </header>
        <section>
            <h1>Welcome to coding world</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit, ullam! Iure dignissimos, optio eaque
                provident fugiat id. Accusantium ipsum quam, explicabo voluptas esse!</p>
        </section>
</body>
</html>
