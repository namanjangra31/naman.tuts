<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts in Css</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
    <!-- This is how we can import styles from internet googleforms.com  -->
    <style>
        body{
            background-color: rgb(216, 216, 116);
        }
        p {
            color: white;
            font-family: 'Tangerine', serif;
            font-size: 48px;

            line-height: 1.1em;
            /* width from up and down from the line  */

            font-weight:bold ;
            text-shadow: 5px 5px 5px #000000;
        }

        span {
            font-family: Impact ;
        }
    </style>
</head>

<body>
    <p>This tut is based on fonts styles </p>
    <span> my name is naman</span>

</body>
<!-- There are many fonts inbuilted in computer ,we can access them by emmit -->
 <!-- if we want to impliment some fonts that are not available in the OS then we can grab them by internet googlefont,cssfontsstack  -->

</html>
