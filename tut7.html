<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Entities</title>
</head>
<body>
    <div>
        <p>This is a &nbsp; paragraph</p>
        <!-- &nsbp; is for space -->
        <p>Paragraph can be written as &lt;p&gt;</p>
         <!-- We can't write <p> on live server but using &lt;p&gt; we can write it on live server-->
            <p>Pound can be written as &pound;</p>
            <p>copywrite can be written as &copy;</p>
            <span style="border: 2px solid red;">Empty character can be written as &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 &#8203 </span>
            <!-- we can see more entities on internet -->

    </div>
    
</body>
</html>
