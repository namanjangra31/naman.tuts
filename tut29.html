<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes and Animations</title>
</head>
<style>
    .container{
        background-color: lightgreen; 
    }

    .box{
        height: 200px;
        width: 200px;
        background-color: green;
        position: relative;
        /* animation-name: naman;  */
        animation-name: naman1;
        animation-duration: 6s;
         animation-iteration-count: 1; 
          animation-iteration-count: infinite;  
        /* forward help to stuck after reaching its max width  */
        /* animation-fill-mode: forwards; */
        /* alternate - animation ends after reaching max width  */
        /* animation-fill-mode: alternate;  */
        /* ease-in - Goes slow and reach fast towards max width */
        /* animation-timing-function: ease-in;  */
        /* ease-out - Goes fast and reach slow towards max width */
        /* animation-timing-function: ease-out; */
        /* ease-in-out - slow-fast-slow  */
        /* animation-timing-function: ease-in-out;  */
        /* delay - animation starts in 3s*/
        /* animation-delay: 3s;  */
        /* direction (reverse) - That animation goes in reverse direction*/
         /* animation-direction:reverse;   */
         /* We can set all animation proerties in one */
         /* Animation : animation-name animation-duration animation-timing-function animation-delay animation-iteration-count animation-fill-mode */
        }

        @keyframes naman1{
            0%{
                top: 0px;
                left: 0px;
            }
            25%{
                top: 250px;
                left: 0px;
            }
            50%{
                top: 250px;
                left: 250px;
            }
            75%{
                top: 0px;
                left: 250px;
            }
            100%{
                top: 0px;
                left: 0px;
            }
            
        }

    @keyframes naman {
        from{
            width: 200px;
        }
        To{
            width: 1200px;
        }
    }

</style>
<body>
    <div class="container">
        <div class="box">
            This is a box
        </div>
    </div>
</body>
</html>
