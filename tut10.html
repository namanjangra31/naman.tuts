<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDs and classes in css</title>
    <style>
        p{
            color: chocolate;
        }
        /* this is element selector  */
     #secondpara{
        color: red;
     }
     /* # this is id selector  */
        .redelement{

            color: yellow;
        }
        .bgblue{
            background-color:black;
        }
        /* . this is class selector  */

    </style>
</head>
<body>
    <p>My name is naman</p>
    <p id="firstpara" class="redelement bgblue"> This is a paragraph for example </p>
    <p id="secondpara"> is another paragrapgh for example</p>
    <div>
    <p>This is another paragrapgh for example</p>
</div>
</body>
</html>
