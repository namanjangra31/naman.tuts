<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lists and Tables </title>
</head>

<body>
    <ul type="square">
        <!-- there are three type circle 🔘,square ⬛,disk ⚫-->
        <li> this is first line </li>
        <li> this is second line </li>
        <li> this is third line </li>
    </ul>
    <!-- this is an unordered list  -->

    <ol type="a">
        <!-- there are five type a,A,1,i -->
        <li> this is first line </li>
        <li> this is second line </li>
        <li> this is third line </li>
    </ol>
    <!-- this is an oredered list  -->


    <ul type="square">
        <li> first line </li>
        <li> second line </li>
        <ul>
            <li> two </li>
            <li> 2 </li>
        </ul>
        <li> third line </li>
        <li> fourth line </li>
        <li> fifth line </li>
    </ul>
    <!-- this is how we can make list inside a list  -->
    <hr>

    <h3> Tables </h3>
    <table>
        <thead>
            <tr>
                <th>Name </th>
                <th> Roll no.</th>
                <th>Section </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> Naman</td>
                <td> 01</td>
                <td> A</td>
            </tr>
            <tr>
                <td> Rohan</td>
                <td> 02</td>
                <td> B</td>
            </tr>
        </tbody>
    </table>
    <!-- This is how tables are made  -->
    <!-- <tr> is use for makeing new rows  -->
    <!-- <th> is used for putting head data only  -->
    <!-- <td> is used for putting all the data  -->

</body>
</html>
