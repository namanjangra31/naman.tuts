<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block elements</title>
</head>
<body>
    <p>This is a paragraph</p> <p>This is also a paragraph</p>
    <!-- p is a block element it takes all the space -->
    <span>this is span</span> <span>this is also a span</span>
    <!-- span is a inline elment it takes limited space -->
     <hr>
     <h2>Example for better understanding</h2>
       <p style="border: 2px solid red;">This is a paragraph</p> <p style="border: 2px solid blue;">This is also a paragraph</p>
    
    <span style="border: 2px solid red;">this is span</span> <span style="border: 2px solid red;">this is also a span</span>
     <!-- exapmle = div is a block element and strong is a inline element -->
</body>
</html>
