<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Variable / Custom Properties</title>
</head>
    <style>
        /*:root helps as an global object, anybody can use*/
        :root{
            --box-color:blue;
            --danger-color:red;
            --primary-color:yellow;
            --maxw: 640px;
        }
        .box{
            /* This can only access in this .box */
            --box-color:blue;
            width: 200px;
            height: 200px;
            background-color:var(--box-color);
            border: 2px solid red;
            box-shadow: 5px 5px var(--primary-color);
            margin: 2px 9px ;
        }
        .container{
             --box-color: pink; 
            display: flex;
            margin: auto;
            align-items: center;
            justify-content: center;
            max-width: var(--maxw);
            background-color: var(--box-color);
        }
    </style>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
