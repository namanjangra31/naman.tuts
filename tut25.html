<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute and nth child pseudo selectors</title>
</head>
<style>
    .container {
        display: block;
        margin: auto;
        width: 233px;
    }

    input {
        display: block;
    }

    input[type='text'] {
        padding: 23px;
        border: 2px solid red;
    }

    a[target] {
        font-size: 40px;
        color: violet;
    }

    a[target='_self'] {
        font: 30px;
        color: blue;
    }

    input[type='submit'] {
        border: 3px solid yellow;
    }

    /* This will apply for 3rd child in li  */
    /* li:nth-child(3){
        color: green;
    }
    li:nth-child(2n+0){
        color: red;
    } */
    li:nth-child(3n+3) {
        color: deeppink;
    }

    /* This is for odd child | same for even (even) */
    li:nth-child(odd) {
        color: brown;
    }
</style>

<body>
    <div class="container">
        <h1><a href="http://google.com" target="_blank">Go to goggle</a></h1>
        <h1><a href="http://facebook.com" target="_self">Go to facebook</a></h1>
        <form action="" class="formcontrol">
            <input type="text" placeholder="Enter your name">
            <input type="password" placeholder="Enter your password">
            <input type="submit" value="submit">
        </form>
        <ul>
            <li class="item" id="item-1">Item1</li>
            <li class="item" id="item-2">Item2</li>
            <li class="item" id="item-3">Item3</li>
            <li class="item" id="item-4">Item4</li>
            <li class="item" id="item-5">Item5</li>
            <li class="item" id="item-6">Item6</li>
            <li class="item" id="item-7">Item7</li>
            <li class="item" id="item-8">Item8</li>
        </ul>
    </div>
</body>

</html>
