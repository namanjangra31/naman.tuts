<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline,Internal and external Css</title>
    <link rel="stylesheet" href="tut9.css">
    <!-- This is how we link another file for using external Css -->
    <style>
        p {
            color: blue;
            background: green;
        }
    
    </style>
    <!-- <style> is used for internal css -->
</head>

<body>
    <h3 style="color: red; background: black;"> This is tut9</h3>
    <!-- this how inline css is used  -->
    <p>This is css tut</p>
    <span>This is for external css</span>
   
</body>
</html>
